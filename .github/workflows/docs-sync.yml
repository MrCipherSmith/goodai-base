name: Sync Docs Catalogs

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'rules/**'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install script dependencies
        run: cd scripts && bun install

      - name: Generate skill catalog
        run: cd scripts && bun run generate-skill-catalog

      - name: Generate rules catalog
        run: cd scripts && bun run generate-rules-catalog

      - name: Commit updated docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/skill-catalog.md docs/ai/skill-catalog.yaml docs/rules-catalog.md
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "chore(docs): regenerate skill and rules catalogs [skip ci]"
            git push
          fi
